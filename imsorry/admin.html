<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f1115;
        color: #e6e8eb;
        padding: 2rem 1.25rem;
      }
      h1 { font-size: 1.25rem; margin: 0 0 1rem; }
      .gate, .panel {
        max-width: 960px;
        margin: 0 auto;
        background: #161a21;
        border: 1px solid #232833;
        border-radius: 14px;
        padding: 1.25rem;
      }
      .gate { max-width: 420px; }
      input, button {
        font: inherit;
        border-radius: 10px;
        border: 1px solid #2a303c;
        padding: 0.7rem 0.9rem;
      }
      input {
        background: #0f1115;
        color: inherit;
        width: 100%;
      }
      button {
        background: #2d7ff9;
        color: white;
        border: 0;
        cursor: pointer;
        margin-top: 0.75rem;
        width: 100%;
      }
      .row { display: grid; gap: 0.5rem; }
      .error { color: #ff8181; margin-top: 0.6rem; font-size: 0.9rem; }
      .muted { color: #8a93a3; font-size: 0.85rem; }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1rem;
        font-size: 0.9rem;
      }
      th, td {
        text-align: left;
        padding: 0.55rem 0.6rem;
        border-bottom: 1px solid #232833;
        vertical-align: top;
      }
      th { color: #8a93a3; font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.03em; }
      .meta { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1rem; }
      .pill {
        display: inline-block;
        padding: 0.2rem 0.55rem;
        border-radius: 999px;
        background: #1d2330;
        color: #a8b1c1;
        font-size: 0.75rem;
      }
      @media (max-width: 640px) {
        table, thead, tbody, tr, th, td { display: block; }
        thead { display: none; }
        tr { border-bottom: 1px solid #232833; padding: 0.6rem 0; }
        td { border: 0; padding: 0.2rem 0; }
        td::before { content: attr(data-label) ": "; color: #8a93a3; font-size: 0.78rem; }
      }
    </style>
  </head>
  <body>
    <h1>Admin</h1>

    <section id="gate" class="gate">
      <div class="row">
        <label for="pass" class="muted">Enter passphrase</label>
        <input id="pass" type="password" autocomplete="off" />
        <button id="unlock" type="button">Unlock</button>
        <p id="gate-error" class="error" hidden></p>
      </div>
    </section>

    <section id="panel" class="panel" hidden>
      <div class="meta">
        <span class="pill" id="count">0 events</span>
        <button id="refresh" type="button" style="width:auto;background:#1d2330;color:#e6e8eb;">Refresh</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>Event</th>
            <th>Detail</th>
            <th>Location</th>
            <th>Visitor</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>

    <script type="module">
      import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
      import { supabaseConfig } from "./supabase-config.js";

      const supabase = supabaseConfig.url && supabaseConfig.anonKey
        ? createClient(supabaseConfig.url, supabaseConfig.anonKey)
        : null;

      const gate = document.getElementById("gate");
      const panel = document.getElementById("panel");
      const passInput = document.getElementById("pass");
      const unlockBtn = document.getElementById("unlock");
      const refreshBtn = document.getElementById("refresh");
      const gateError = document.getElementById("gate-error");
      const rows = document.getElementById("rows");
      const count = document.getElementById("count");

      let currentPass = sessionStorage.getItem("imsorry-admin-pass") || "";

      function showError(message) {
        gateError.textContent = message;
        gateError.hidden = false;
      }

      function formatTime(value) {
        return new Date(value).toLocaleString();
      }

      function formatLocation(row) {
        const parts = [row.city, row.region, row.country].filter(Boolean);
        return parts.length ? parts.join(", ") : "—";
      }

      async function loadEvents() {
        if (!supabase) {
          showError("Supabase is not configured.");
          return;
        }

        const { data, error } = await supabase.rpc("read_apology_interactions", {
          p_passphrase: currentPass,
          p_site_label: supabaseConfig.siteLabel || null,
          p_limit: 200,
        });

        if (error) {
          showError("Wrong passphrase or not allowed.");
          panel.hidden = true;
          gate.hidden = false;
          sessionStorage.removeItem("imsorry-admin-pass");
          return;
        }

        gate.hidden = true;
        panel.hidden = false;

        const list = data || [];
        count.textContent = `${list.length} event${list.length === 1 ? "" : "s"}`;

        rows.innerHTML = list.map((row) => `
          <tr>
            <td data-label="Time">${formatTime(row.created_at)}</td>
            <td data-label="Event">${row.event_name}</td>
            <td data-label="Detail">${row.event_detail ?? ""}</td>
            <td data-label="Location">${formatLocation(row)}</td>
            <td data-label="Visitor">${row.visitor_id.slice(0, 8)}…</td>
          </tr>
        `).join("");
      }

      unlockBtn.addEventListener("click", async () => {
        currentPass = passInput.value.trim();
        if (!currentPass) {
          showError("Enter a passphrase.");
          return;
        }
        sessionStorage.setItem("imsorry-admin-pass", currentPass);
        gateError.hidden = true;
        await loadEvents();
      });

      passInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          unlockBtn.click();
        }
      });

      refreshBtn.addEventListener("click", loadEvents);

      if (currentPass) {
        loadEvents();
      }
    </script>
  </body>
</html>
